<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d5c78" />
    <meta name="description" content="Rutina de entrenamiento interactiva" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Megatlon Rutina</title>
    <link
      rel="preload"
      href="fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css?v=31" />
  </head>
  <body>
    <div class="app" id="app" data-view="routine">
      <nav
        class="rail"
        id="exercise-rail"
        aria-label="Índice de ejercicios"
      ></nav>

      <main id="day-content" class="day-content"></main>

      <nav class="dock" aria-label="Navegación">
        <div class="tabs" id="day-tabs" aria-label="Días de rutina"></div>
        <div class="dock__primary">
          <button type="button" class="dock__btn" id="nav-user" aria-label="Usuario">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              aria-hidden="true"
              focusable="false"
            >
              <circle
                cx="12"
                cy="8"
                r="3.25"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M5.5 19.25c1.4-3.2 3.5-4.75 6.5-4.75s5.1 1.55 6.5 4.75"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            Usuario
          </button>
          <button type="button" class="dock__btn" id="nav-biometric" aria-label="Medición biométrica">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 3v18M8 7h8M7 12h10M8 17h8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <rect
                x="5"
                y="4"
                width="14"
                height="16"
                rx="2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
            </svg>
            Biometría
          </button>
          <button type="button" class="dock__btn" id="nav-routine" aria-label="Rutina">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M4 7.25h16M4 12h16M4 16.75h16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            Rutina
          </button>
        </div>
      </nav>
    </div>

    <dialog class="dialog" id="add-exercise-dialog" aria-labelledby="add-exercise-title">
      <form class="dialog__form" id="add-exercise-form">
        <h2 class="dialog__title" id="add-exercise-title">Agregar ejercicio</h2>
        <label class="dialog__field">
          <span>Nombre</span>
          <input
            id="add-exercise-name"
            name="name"
            type="text"
            maxlength="80"
            autocomplete="off"
            required
            placeholder="Ej: Press banca"
          />
        </label>
        <div class="dialog__row">
          <label class="dialog__field">
            <span>Series</span>
            <input
              id="add-exercise-sets"
              name="sets"
              type="number"
              inputmode="numeric"
              min="1"
              step="1"
              value="3"
              required
            />
          </label>
          <label class="dialog__field">
            <span>Repeticiones</span>
            <input
              id="add-exercise-reps"
              name="reps"
              type="number"
              inputmode="numeric"
              min="1"
              step="1"
              value="10"
              required
            />
          </label>
        </div>
        <div class="dialog__actions">
          <button type="button" class="dialog__cancel" id="add-exercise-cancel">
            Cancelar
          </button>
          <button type="submit" class="dialog__submit">Agregar</button>
        </div>
      </form>
    </dialog>

    <script src="app.js?v=31" defer></script>
  </body>
</html>
