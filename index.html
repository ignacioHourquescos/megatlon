<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f2933" />
    <meta name="description" content="Rutina de entrenamiento interactiva" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Megatlon Rutina</title>
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body>
    <div class="app" id="app" data-view="routine">
      <header class="topbar">
        <div class="topbar__gutter">
          <button
            type="button"
            class="profile-btn"
            id="profile-btn"
            aria-label="Peso corporal"
            title="Peso corporal"
            aria-pressed="false"
          >
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              aria-hidden="true"
              focusable="false"
            >
              <circle
                cx="12"
                cy="8"
                r="3.25"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M5.5 19.25c1.4-3.2 3.5-4.75 6.5-4.75s5.1 1.55 6.5 4.75"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <nav class="tabs" id="day-tabs" aria-label="Días de rutina"></nav>
      </header>

      <nav
        class="rail"
        id="exercise-rail"
        aria-label="Vista rápida de ejercicios"
      ></nav>

      <main id="day-content" class="day-content"></main>
    </div>

    <script src="app.js?v=21" defer></script>
  </body>
</html>
